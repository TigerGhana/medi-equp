name: Supabase Keep-Alive

# Runs on GitHub's own servers -- genuinely external to Supabase, which is
# exactly what was missing from the old pg_cron-based approach (that ran
# INSIDE the Supabase project itself, and self-originated traffic like that
# does not count toward Supabase's free-tier pause-prevention, regardless
# of whether the HTTP request technically succeeds).
#
# Setup (one-time):
#   1. In this repo: Settings -> Secrets and variables -> Actions -> New
#      repository secret.
#   2. Name:  SUPABASE_ANON_KEY   (must match exactly, case-sensitive)
#      Value: ONLY the raw anon (public) key for the ceu-regional-platform
#      project -- no quote marks, no spaces, no line breaks. Copy it with the
#      "copy" button in Supabase -> Project Settings -> API, making sure the
#      project selector (top left) says ceu-regional-platform first.
#   3. Commit this file. It will run automatically from then on.
#   4. To confirm it works right now rather than waiting for 03:00 UTC:
#      go to the "Actions" tab -> "Supabase Keep-Alive" -> "Run workflow".
#
# The first step reads the project ID stored inside the key itself (it is
# part of the key's visible contents, not a secret) and compares it to the
# project this workflow pings. A key copied from a different Supabase
# project is the one mistake a length check cannot catch, so this does.
# NOTE: the first/last-characters lines are only safe to print because an
# anon key is public by design. If this workflow is ever reused with a
# private key (service_role, database password), delete those two lines.

"on":
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: xxfvxrzcgowpkcfrvcyd
      # Passed via env:, not inline ${{ }} interpolation in the shell script --
      # the safer pattern, so a secret containing quotes or special characters
      # cannot corrupt the generated command.
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Verify the key belongs to this project
        shell: python
        run: |
          import base64, json, os, sys

          key = os.environ.get("SUPABASE_ANON_KEY", "")
          expected_ref = os.environ["SUPABASE_PROJECT_REF"]

          def fail(message):
              print("::error::" + message)
              sys.exit(1)

          if not key:
              fail("SUPABASE_ANON_KEY secret is empty or not set. Add it under Settings -> Secrets and variables -> Actions.")

          print("Secret length:", len(key), "characters (a correct anon key is 208)")
          print("First 6 characters:", key[:6])
          print("Last 6 characters:", key[-6:])

          if any(c in key for c in " \t\r\n\"'"):
              fail("The secret contains a space, line break, or quote mark. Paste only the key itself, with nothing around it.")

          try:
              payload = key.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
              if not isinstance(claims, dict):
                  raise ValueError("unexpected contents")
          except Exception:
              fail("The secret is not a Supabase JWT key (it should start with 'eyJ' and contain two dots). The newer short 'sb_publishable_...' key will not work here.")

          ref = claims.get("ref")
          role = claims.get("role")
          print("Key belongs to project:", ref)
          print("Key role:", role)

          if ref != expected_ref:
              fail("This key belongs to a DIFFERENT Supabase project (" + str(ref) + "), not " + expected_ref + ". Open the ceu-regional-platform project in Supabase and copy its anon key from Project Settings -> API.")
          if role != "anon":
              fail("This key has the role '" + str(role) + "' but an 'anon' key is needed.")

          print("OK: key matches this project and has the anon role.")

      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /tmp/response_body.txt -w "%{http_code}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/regions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response_body.txt
          echo ""
          if [ "$response" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP status '$response' -- see the response body above for the actual reason Supabase gave."
            exit 1
          fi
          echo "Keep-alive ping succeeded."
